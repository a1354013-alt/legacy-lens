services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        VITE_DEV_AUTH_BYPASS: "1"
    environment:
      - DATABASE_URL=mysql://root:password@db:3306/legacy_lens
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - legacy-lens-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DEV_AUTH_BYPASS: "1"
        APP_VERSION: ${APP_VERSION:-demo}
    ports:
      - "${LEGACY_LENS_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_VERSION=${APP_VERSION:-demo}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-http://localhost:${LEGACY_LENS_PORT:-3000}}
      - DATABASE_URL=mysql://root:password@db:3306/legacy_lens
      - JWT_SECRET=${JWT_SECRET:-legacy-lens-demo-secret-0123456789}
      - VITE_APP_ID=${VITE_APP_ID:-legacy-lens-demo}
      - VITE_OAUTH_PORTAL_URL=${VITE_OAUTH_PORTAL_URL:-http://localhost:3001}
      - OAUTH_SERVER_URL=${OAUTH_SERVER_URL:-http://localhost:3001}
      - LEGACY_LENS_TRUST_PROXY=${LEGACY_LENS_TRUST_PROXY:-}
      - LEGACY_LENS_GIT_HOST_ALLOWLIST=${LEGACY_LENS_GIT_HOST_ALLOWLIST:-github.com,gitlab.com}
      - DEV_AUTH_BYPASS=1
      - DEV_AUTH_OPEN_ID=${DEV_AUTH_OPEN_ID:-local-dev-user}
      - DEV_AUTH_BYPASS_UNSAFE_ALLOW=1
      - PROJECT_WORKER_ENABLED=${PROJECT_WORKER_ENABLED:-true}
      - PROJECT_WORKER_ID=${PROJECT_WORKER_ID:-demo-worker-1}
      - PROJECT_JOB_STALE_MS=${PROJECT_JOB_STALE_MS:-900000}
      - PROJECT_JOB_LEASE_MS=${PROJECT_JOB_LEASE_MS:-30000}
      - PROJECT_JOB_HEARTBEAT_MS=${PROJECT_JOB_HEARTBEAT_MS:-10000}
      - PROJECT_JOB_MAX_ATTEMPTS=${PROJECT_JOB_MAX_ATTEMPTS:-3}
      - PROJECT_JOB_EXECUTION_TIMEOUT_MS=${PROJECT_JOB_EXECUTION_TIMEOUT_MS:-1800000}
      - PROJECT_WORKER_POLL_INTERVAL_MS=${PROJECT_WORKER_POLL_INTERVAL_MS:-2000}
      - UPLOAD_TEMP_ZIP_TTL_MS=${UPLOAD_TEMP_ZIP_TTL_MS:-86400000}
      - UPLOAD_TEMP_ZIP_CLEANUP_INTERVAL_MS=${UPLOAD_TEMP_ZIP_CLEANUP_INTERVAL_MS:-3600000}
      - DB_CONNECTION_LIMIT=${DB_CONNECTION_LIMIT:-10}
      - DB_QUEUE_LIMIT=${DB_QUEUE_LIMIT:-0}
      - DB_WAIT_FOR_CONNECTIONS=${DB_WAIT_FOR_CONNECTIONS:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CSP_ALLOW_UNSAFE_EVAL=${CSP_ALLOW_UNSAFE_EVAL:-true}
      - LAST_SIGNED_IN_WRITE_THROTTLE_MS=${LAST_SIGNED_IN_WRITE_THROTTLE_MS:-900000}
      - GRACEFUL_SHUTDOWN_TIMEOUT_MS=${GRACEFUL_SHUTDOWN_TIMEOUT_MS:-10000}
      - GIT_COMMIT=${GIT_COMMIT:-demo}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - legacy-lens-network

  db:
    image: mysql:8.0
    ports:
      - "${LEGACY_LENS_DB_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=legacy_lens
      - MYSQL_USER=legacy_user
      - MYSQL_PASSWORD=legacy_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-ppassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - legacy-lens-network

volumes:
  mysql-data:
    driver: local

networks:
  legacy-lens-network:
    driver: bridge
